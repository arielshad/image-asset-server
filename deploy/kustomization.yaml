# Production manifests for image.shep.bot, deployed by ArgoCD from this repo's
# main branch (registered in shep-ai/shep-infra:
# bootstrap/apps/89-image-asset-server.yaml, which also creates the
# `image-asset-server` namespace).
#
# CI (.github/workflows/ci.yml) builds ghcr.io/arielshad/image-asset-server on
# every push to main and commits the new sha tag to `newTag` below — that
# commit is the deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-asset-server
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml
images:
  - name: ghcr.io/arielshad/image-asset-server
    # Replaced by CI with the first image built from main.
    newTag: sha-84ec8c4b31e0a2bc4eaaabb2cd2a5192b8a77331
